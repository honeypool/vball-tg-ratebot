WELCOME: |-
  🏐 <b>Volejbola līmeņa vērtējumu bots</b>

  Mūsu grupas spēlētāji pēc kopīgām spēlēm novērtē cits cita prasmes. Jūsu līmenis (0.0–6.0) tiks rādīts kā birka (Name tag) blakus jūsu vārdam grupā.

  • Vērtējumi ir anonīmi: neviens neredz, kurš ko novērtēja.
  • Jūsu vārds netiek saglabāts. Tiek glabāts tikai jūsu Telegram ID, valoda, vērtējumi un spēles, kurās piedalījāties.
  • Jebkurā brīdī varat atsaukt piekrišanu un dzēst visus savus datus.

  Vai piekrītat piedalīties?
