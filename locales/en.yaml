WELCOME: |-
  🏐 <b>Volleyball level bot</b>

  Players of our group rate each other's skill after playing together. Your level (0.0–6.0) is shown as a tag next to your name in the group.

  • Ratings are anonymous: nobody sees who rated whom.
  • Your name is not stored. Only your Telegram ID, language, ratings and the games you played.
  • You can revoke consent and delete all your data at any time.

  Do you agree to take part?
