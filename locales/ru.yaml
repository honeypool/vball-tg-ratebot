WELCOME: |-
  🏐 <b>Бот оценки уровня игры в волейбол</b>

  Игроки нашей группы оценивают уровень друг друга после совместных игр. Ваш уровень (0.0–6.0) показывается тегом рядом с вашим именем в группе.

  • Оценки анонимны: никто не видит, кто кого оценил.
  • Ваше имя не хранится. Хранятся только ваш Telegram ID, язык, оценки и игры, в которых вы участвовали.
  • Вы можете в любой момент отозвать согласие и удалить все свои данные.

  Вы согласны участвовать?
