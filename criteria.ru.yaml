# Volleyball player skill rating criteria
# Language: Russian (translated from criteria.en.yaml)

meta:
  language: ru
  version: "1.0"
  notes:
    credit: >-
      Translated from criteria.en.yaml, which is taken from https://phillyvolleyball.org/.
      Division codes are replaced by level numbers: B = 1, BB = 2–3, A = 4–5, AA = 6.

levels:
  - level: 0
    criteria:
      attacking: >-
        Игроку трудно перебить мяч через сетку и/или попасть в площадку.
      blocking: >-
        Игрок не может поднять руки к верхнему краю сетки или не может безопасно
        приземлиться на своей стороне, не задев сетку или другого игрока.
      defense: >-
        Игроку трудно поднять мяч вверх, когда по нему бьют.
      serve_receive: >-
        Игроку трудно принять мяч.
      serving: >-
        Игроку трудно выполнить подачу по правилам.
      setting: >-
        Игроку трудно точно отдать мяч партнёрам для удара.

  - level: 1
    criteria:
      attacking: >-
        Игрок может атаковать мяч сверху: как минимум со средней силой по дуге
        в последнюю треть площадки или с малой/средней силой по нисходящей
        траектории.
      blocking: >-
        Игрок может поставить одиночный блок — руки выше сетки или «мягкий» блок
        у верхнего края сетки — и безопасно приземлиться на своей стороне.
      defense: >-
        Игрок ещё учится читать нападающих, но может принять в защите мячи,
        пробитые или скинутые в него, и направить их в целом вверх и к передней
        зоне.
      serve_receive: >-
        Игрок может принять несильную подачу, направив мяч к сетке / в переднюю
        половину площадки.
      serving: >-
        Игрок может выполнить подачу по правилам (снизу или сверху) и стабильно
        вводить мяч в игру.
      setting: >-
        Когда мяч принят в переднюю часть площадки, игрок может стабильно дать
        партнёру удобный для удара мяч — передачей снизу или сверху.

  - level: 2
    criteria:
      attacking: >-
        Игрок может атаковать нападающим ударом или сильным ударом без прыжка.
        Знает, куда отойти и как переместиться, чтобы выйти на разбег и ударить,
        и может немного подстроиться под неточную передачу. Удары могут быть
        несильными, но обычно попадают в площадку и так, что игрокам уровня 2–3
        трудно их достать.
      blocking: >-
        Игрок может поднять руки выше сетки и помешать атаке соперника: коснуться
        мяча или направить его партнёрам. Иногда ставит двойной блок с соседним
        игроком. Прыгает и безопасно приземляется, не касаясь сетки.
      defense: >-
        Игрок хорошо ориентируется на площадке и знает, куда смещаться под удар.
        Может принять в защите удары средней силы приёмом снизу или сверху и
        поднять мяч высоко, чтобы команда до него добралась. Понимает, где стоять
        в базовой позиции в защите. Редко ошибается на лёгком мяче.
      serve_receive: >-
        Игрок стабильно (70% случаев) принимает подачу средней силы так, что из
        мяча можно сделать передачу, — сверху или приёмом снизу. На большинстве
        приёмов у связующего есть хотя бы 1 простой вариант передачи. В целом
        понимает, где стоять на приёме, но в более организованной системе (5-1
        или 6-2) ему могут понадобиться подсказки партнёров.
      serving: >-
        Игрок стабильно (70%) подаёт сверху в площадку. Может подавать в
        определённые зоны, чтобы осложнить приём сопернику.
      setting: >-
        Игрок стабильно даёт удобную для удара передачу доигровщику и
        центральному из большей части передней зоны и иногда делает передачу
        назад. Уверенно играет сверху, почти без двойных касаний. Знает, как
        перемещаться по площадке, когда он назначенный связующий (обычно в
        системе 4-2 или 5-1).

  - level: 3
    criteria:
      attacking: >-
        Игрок знает, где находиться на площадке по ходу развития атаки, и может в
        прыжке бить по мячу вниз. Находит свободные зоны в защите, и хорошая
        передача против игроков уровня 2–3 обычно заканчивается очком. Игра без
        ошибок не ожидается, но эффективность атаки в целом должна быть
        положительной.
      blocking: >-
        Игрок может поднять руки выше сетки и перенести их на сторону соперника,
        отнимая у него часть вариантов. Хорошо выбирает момент для блока и
        следит за связующим и нападающими, ставя двойной блок с партнёрами.
      defense: >-
        Игрок всегда знает, где быть по ходу розыгрыша, как делить площадку и за
        что отвечает в обычной базовой защите, и общается с партнёрами. Когда в
        него бьют игроки уровня 2–3, обычно может принять мяч вверх и в переднюю
        зону / к связующему.
      serve_receive: >-
        Игрок стабильно (70% случаев) принимает подачу игроков уровня 2–3 в цель,
        оставляя связующему не менее 2 простых вариантов передачи. Договаривается
        с партнёрами о мячах в стык и знает, где стоять на приёме в системах 5-1
        и 6-2.
      serving: >-
        Игрок стабильно (70%) подаёт в выбранную зону. Против игроков уровня 2–3,
        а иногда и уровня 4–5, может подавать так, что осложняет приём или
        иногда приносит эйс.
      setting: >-
        Игрок точно даёт передачу любому нападающему передней линии с хорошего
        приёма. Может отдавать передачу в движении и подстраиваться под мяч в
        большинстве зон площадки, чтобы дать партнёрам удобный для удара мяч, и
        договаривается с нападающими о нужных им передачах. Умеет руководить
        игрой в системе 5-1 или 6-2.

  - level: 4
    criteria:
      attacking: >-
        Игрок может сильно бить мяч вниз. Умеет подстроиться под неточную
        передачу и всё равно надёжно ударить с силой или в удачную зону, выводя
        соперника из системы. Работа ног позволяет перемещаться по площадке и
        выходить на разбег в быстрой атакующей системе. Принимает разумные
        решения и использует разные варианты атаки, чтобы набирать очки даже
        против двойного блока. Эффективность атаки обычно не ниже 0,100.
      blocking: >-
        Игрок может поднять руки выше сетки и перенести их на сторону соперника,
        отнимая у него варианты и направляя удары в нужные зоны защиты.
        Стабильно замыкает двойной (или тройной) блок с партнёрами. Блок часто
        даёт касание мяча, а иногда и очко.
      defense: >-
        Игрок умеет читать игру от блока и предугадывать, куда будет удар, чтобы
        занять позицию для приёма против атаки уровня 4–5 с несколькими
        нападающими. Хорошая техника и чутьё в защите. Когда рядом делают скидку
        или накат, обычно хорошо принимает мяч на связующего.
      serve_receive: >-
        Игрок стабильно (75% случаев) принимает подачу игроков уровня 4–5 в цель,
        оставляя связующему не менее 2 простых вариантов передачи. Эйсы
        пропускает редко, а неточные приёмы обычно всё равно остаются
        играбельными для партнёров.
      serving: >-
        Против игроков уровня 4–5 может подавать так, что осложняет приём или
        иногда приносит эйс. Может больше рисковать и подавать агрессивнее, но в
        большинстве случаев мяч должен перелетать через сетку и попадать в
        площадку.
      setting: >-
        Игрок может руководить атакой высокого уровня, подстраиваясь под приём в
        любой точке площадки. Умеет объявлять и проводить конкретные комбинации с
        нападающими. Отдаёт передачу в движении и даже с плохого приёма обычно
        может дать партнёрам удобный для удара мяч.

  - level: 5
    criteria:
      attacking: >-
        Игрок стабильно набирает очки против игроков уровня 4–5. Эффективно
        атакует из передней и задней линии и набирает очки даже с неточных
        передач. Обладает пониманием игры и атлетизмом для более сложной атаки с
        заранее отработанными комбинациями. Эффективность атаки обычно не ниже
        0,250.
      blocking: >-
        Игрок быстро подстраивается под атаку с несколькими сильными
        нападающими, следя за связующим и нападающими соперника. Блок полностью
        переносится на сторону соперника и создаёт давление на сильных
        нападающих: касания, блоки-очки или вынужденные ошибки.
      defense: >-
        Игрок читает игру сильных нападающих и подстраивается под неё. Надёжно
        закрывает свою зону ответственности и может принять даже удары самых
        сильных нападающих, давая партнёрам шанс сыграть мяч.
      serve_receive: >-
        Игрок стабильно (85% случаев) принимает подачу игроков уровня 4–5 в цель,
        оставляя связующему все 3 варианта передачи. Эйсы пропускает редко, а
        неточные приёмы всё равно можно перевести в атаку вне системы.
      serving: >-
        Против игроков уровня 4–5 регулярно (80%) подаёт так, что осложняет
        приём. Часто подаёт эйсы игрокам более низкого уровня.
      setting: >-
        Игрок обладает высокой техникой передачи из любой точки площадки и
        принимает разумные решения. Удерживает команду в системе даже с
        посредственного приёма и разыгрывает комбинации, дающие нападающим
        преимущество над блоком. Почти каждым касанием улучшает мяч.

  - level: 6
    criteria:
      attacking: >-
        Игрок — один из главных источников очков в атаке высокого уровня. Очень
        атлетичен, подстраивается под блок и защиту соперника и набирает очки с
        очень высокой стабильностью.
      blocking: >-
        Игрок читает атаку уровня 6 и подстраивается под неё, физически участвуя
        в системе блока (совместные или одиночные блоки-очки), либо доминирует
        над атакой соперника уровня 4–5, ставя несколько блоков-очков за игру.
      defense: >-
        Отличное чутьё и атлетизм в защите позволяют игроку оказываться в нужном
        месте и принимать мяч против самой сильной атаки. Принятый мяч уходит
        высоко и в переднюю зону, где у связующего несколько вариантов.
      serve_receive: >-
        Игрок стабильно (90% случаев) принимает в цель подачу игроков уровня 6.
        Эйсы пропускает редко и почти всегда даёт команде играбельный мяч.
      serving: >-
        Против игроков уровня 6 может подавать так, что выводит соперника из
        системы. Регулярно подаёт эйсы игрокам более низкого уровня.
      setting: >-
        Игрок может руководить сложной атакой и делать передачи с высокой
        стабильностью по высоте, расстоянию и темпу. Принимает разумные решения
        и помогает строить комбинации, освобождая нападающих и давая им
        преимущество над блоком уровня 6.
