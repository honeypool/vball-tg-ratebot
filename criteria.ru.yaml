# Volleyball player skill rating criteria
# Language: Russian (translated from criteria.en.yaml)

meta:
  language: ru
  version: "1.0"
  notes:
    credit: >-
      Translated from criteria.en.yaml, which is taken from https://phillyvolleyball.org/.
      Division codes are replaced by level numbers: B = 1, BB = 2–3, A = 4–5, AA = 6.

levels:
  - level: 0
    criteria:
      attacking: >-
        Игроку трудно перебить мяч на сторону противника и/или попасть в
        площадку.
      blocking: >-
        Игрок не может вынести руки к верхнему краю сетки или не может безопасно
        приземлиться на своей стороне, не коснувшись сетки или другого игрока.
      defense: >-
        Игроку трудно принять и поднять вверх мяч, направленный в него ударом.
      serve_receive: >-
        Игроку трудно принять мяч с подачи.
      serving: >-
        Игроку трудно выполнить подачу по правилам.
      setting: >-
        Игроку трудно точно передать мяч партнёрам для удара.

  - level: 1
    criteria:
      attacking: >-
        Игрок может выполнить удар по мячу сверху: как минимум средней силы по
        дуге в последнюю треть площадки или малой/средней силы по нисходящей
        траектории.
      blocking: >-
        Игрок может поставить одиночный блок — руки над сеткой или «мягкий» блок
        у верхнего края сетки — и безопасно приземлиться на своей стороне
        площадки.
      defense: >-
        Игрок ещё учится разгадывать действия нападающих, но может принимать
        мячи, направленные в него нападающим или обманным ударом, и посылать их
        в целом вверх и к сетке.
      serve_receive: >-
        Игрок может принять несильную подачу, направив мяч к сетке / в переднюю
        половину площадки.
      serving: >-
        Игрок может выполнить подачу по правилам (нижнюю или верхнюю) и
        стабильно вводить мяч в игру.
      setting: >-
        Когда мяч направлен в переднюю часть площадки, игрок может стабильно
        дать партнёру удобную для удара передачу — снизу или сверху.

  - level: 2
    criteria:
      attacking: >-
        Игрок может выполнить нападающий удар в прыжке или сильный удар без
        прыжка. Знает, куда отходить и как перемещаться на площадке, чтобы
        занять место для разбега и удара, и может немного приспособиться к
        неточной передаче. Удары могут быть недостаточно сильными, но обычно
        попадают в площадку и так, что игрокам уровня 2–3 трудно их принять.
      blocking: >-
        Игрок может вынести руки выше сетки и помешать нападению противника:
        коснуться мяча или направить его партнёрам. Иногда ставит двойной блок с
        рядом стоящим игроком. Прыгает и безопасно приземляется, не касаясь
        сетки.
      defense: >-
        Игрок хорошо ориентируется на площадке и знает, как переместиться к
        месту, куда направлен удар. Может принять нападающий удар средней силы
        передачей снизу или сверху и направить мяч высоко, чтобы партнёры
        успели до него добраться. Понимает, какое исходное положение занимать в
        защите. Почти не ошибается при приёме несильно перебитых мячей.
      serve_receive: >-
        Игрок стабильно (70% случаев) принимает подачу средней силы так, что мяч
        удобен для второй передачи, — сверху или снизу. При большинстве приёмов
        у передающего есть хотя бы 1 простой вариант второй передачи. В целом
        понимает, как располагаться на площадке при приёме подачи, но в более
        сложной системе нападения (с выходом игрока задней линии — 5-1 или 6-2)
        ему могут понадобиться подсказки партнёров.
      serving: >-
        Игрок стабильно (70%) выполняет верхнюю подачу в площадку. Может
        направлять подачу в определённые зоны площадки, чтобы затруднить
        противнику приём.
      setting: >-
        Игрок стабильно даёт удобную для удара вторую передачу нападающим зон 4
        и 3 из большей части передней зоны и иногда передаёт мяч за голову.
        Уверенно выполняет верхнюю передачу почти без двойных касаний. Знает,
        как перемещаться по площадке, когда он передающий в своей команде
        (обычно в системе 4-2 — с передающим игроком передней линии — или 5-1).

  - level: 3
    criteria:
      attacking: >-
        Игрок знает, где находиться на площадке по ходу розыгрыша комбинации, и
        может в прыжке выполнить нападающий удар по нисходящей траектории.
        Находит незащищённые места на площадке противника, и с хорошей передачи
        против игроков уровня 2–3 его удар обычно результативен. Игра без
        ошибок не ожидается, но эффективность атаки в целом должна быть
        положительной.
      blocking: >-
        Игрок может вынести руки выше сетки и перенести их на сторону
        противника, закрывая часть направлений удара. Своевременно выполняет
        прыжок на блок, следит за передающим и нападающими противника и ставит
        двойной блок с партнёрами.
      defense: >-
        Игрок всегда знает, где находиться по ходу розыгрыша, как распределены
        зоны ответственности и что входит в его обязанности в принятой системе
        защиты, и поддерживает связь с партнёрами. Когда в него бьют игроки
        уровня 2–3, обычно может принять мяч вверх и направить его к сетке / на
        передающего.
      serve_receive: >-
        Игрок стабильно (70% случаев) точно принимает подачу игроков уровня 2–3,
        оставляя передающему не менее 2 простых вариантов второй передачи.
        Договаривается с партнёрами о мячах, направленных между игроками, и
        знает, как располагаться при приёме подачи в системах 5-1 и 6-2.
      serving: >-
        Игрок стабильно (70%) направляет подачу в выбранное место. Против
        игроков уровня 2–3, а иногда и уровня 4–5, может подавать так, что
        затрудняет приём или иногда выигрывает очко непосредственно с подачи.
      setting: >-
        Игрок с хорошего приёма точно выполняет передачу любому нападающему
        передней линии. Может выполнять передачу после перемещения и
        приспосабливаться к мячам в большинстве зон площадки, чтобы дать
        партнёрам удобную для удара передачу, и согласовывает с нападающими
        нужные им передачи. Умеет руководить игрой в системе 5-1 или 6-2.

  - level: 4
    criteria:
      attacking: >-
        Игрок может выполнить сильный нападающий удар по нисходящей траектории.
        Умеет приспособиться к неточной передаче и всё равно надёжно провести
        удар с силой или в незащищённое место, расстраивая систему игры
        противника. Перемещения позволяют ему выходить на разбег в нападении с
        быстрым темпом и скоростными передачами. Принимает разумные решения и
        использует разнообразные нападающие удары (с переводом, обманные), чтобы
        набирать очки даже против двойного блока. Эффективность атаки обычно не
        ниже 0,100.
      blocking: >-
        Игрок может вынести руки выше сетки и перенести их на сторону
        противника, закрывая блоком направления удара и направляя мяч в зоны,
        где находятся защитники. Стабильно присоединяется к партнёрам при
        двойном (или тройном) блоке. Мяч часто отскакивает от его рук, а иногда
        блок приносит очко.
      defense: >-
        Игрок умеет выбирать место в зависимости от расстановки блока и заранее
        определять направление удара, чтобы принимать мячи против нападения
        уровня 4–5 с несколькими нападающими. Хорошая техника защиты и
        ориентировка. При обманном ударе рядом с ним обычно точно направляет мяч
        на передающего.
      serve_receive: >-
        Игрок стабильно (75% случаев) точно принимает подачу игроков уровня 4–5,
        оставляя передающему не менее 2 простых вариантов второй передачи. Редко
        проигрывает очко на приёме подачи, а неточно принятый им мяч обычно всё
        равно может сыграть кто-то из партнёров.
      serving: >-
        Против игроков уровня 4–5 может подавать так, что затрудняет приём или
        иногда выигрывает очко непосредственно с подачи. Может больше рисковать
        и подавать сильнее, но в большинстве случаев мяч должен перелетать через
        сетку и попадать в площадку.
      setting: >-
        Игрок может руководить нападением высокого уровня, приспосабливаясь к
        приёму в любой точке площадки. Умеет объявлять и проводить определённые
        тактические комбинации с нападающими. Выполняет передачу после
        перемещения и даже с плохого приёма обычно может дать партнёрам удобную
        для удара передачу.

  - level: 5
    criteria:
      attacking: >-
        Игрок стабильно набирает очки против игроков уровня 4–5. Эффективно
        проводит нападающие удары с передней и задней линии и набирает очки даже
        с неточных передач. Обладает пониманием игры и физическими данными для
        более сложного нападения с заранее разученными тактическими
        комбинациями. Эффективность атаки обычно не ниже 0,250.
      blocking: >-
        Игрок быстро приспосабливается к нападению с несколькими сильными
        нападающими, следя за передающим и нападающими противника. Полностью
        переносит руки на сторону противника и создаёт давление на сильных
        нападающих: касается мяча, блокирует удары или вынуждает их ошибаться.
      defense: >-
        Игрок разгадывает действия сильных нападающих и приспосабливается к ним.
        Надёжно выполняет свои обязанности в защите и может принять даже удары
        самых сильных нападающих, давая партнёрам возможность сыграть мяч.
      serve_receive: >-
        Игрок стабильно (85% случаев) точно принимает подачу игроков уровня 4–5,
        оставляя передающему все 3 варианта второй передачи. Редко проигрывает
        очко на приёме подачи, а с его неточного приёма команда всё равно может
        провести атаку при расстроенной системе игры.
      serving: >-
        Против игроков уровня 4–5 регулярно (80%) подаёт так, что затрудняет
        приём. Против игроков более низкого уровня часто выигрывает очко
        непосредственно с подачи.
      setting: >-
        Игрок обладает высокой техникой передачи из любой точки площадки и
        принимает разумные решения. Даже с посредственного приёма сохраняет
        систему игры своей команды и разыгрывает тактические комбинации,
        выводящие нападающих на удар без блока или против одного блокирующего.
        Почти каждым касанием улучшает мяч.

  - level: 6
    criteria:
      attacking: >-
        Игрок — один из ведущих нападающих в команде высокого уровня. Обладает
        отличными физическими данными, приспосабливается к блоку и расстановке
        защитников противника и набирает очки с очень высокой стабильностью.
      blocking: >-
        Игрок разгадывает нападение уровня 6 и приспосабливается к нему, активно
        участвуя в групповом и одиночном блокировании, приносящем очки, либо
        подавляет нападение противника уровня 4–5, блокируя несколько ударов за
        партию.
      defense: >-
        Отличная ориентировка и физические данные позволяют игроку своевременно
        выбирать место и принимать мячи против самого сильного нападения.
        Принятый мяч уходит высоко и к сетке, где у передающего несколько
        вариантов.
      serve_receive: >-
        Игрок стабильно (90% случаев) точно принимает подачу игроков уровня 6.
        Редко проигрывает очко на приёме подачи и почти всегда даёт команде мяч,
        который можно сыграть.
      serving: >-
        Против игроков уровня 6 может подавать так, что расстраивает систему
        игры противника. Против игроков более низкого уровня регулярно
        выигрывает очко непосредственно с подачи.
      setting: >-
        Игрок может руководить сложным нападением и выполнять передачи с высокой
        стабильностью по высоте, длине и скорости. Принимает разумные решения и
        разыгрывает комбинации, выводящие нападающих на удар без блока или
        против одного блокирующего и дающие им преимущество над блоком уровня 6.
