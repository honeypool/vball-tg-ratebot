# Volleyball player skill rating criteria
# Language: Latvian (translated from criteria.en.yaml)

meta:
  language: lv
  version: "1.1"
  notes:
    credit: >-
      Translated from criteria.en.yaml, which is taken from https://phillyvolleyball.org/.
      Division codes are replaced by level numbers: B = 1, BB = 2–3, A = 4–5, AA = 6.

levels:
  - level: 0
    criteria:
      attacking: >-
        Spēlētājam ir grūti pārsist bumbu pāri tīklam un/vai trāpīt laukumā.
      blocking: >-
        Spēlētājs nevar pacelt rokas līdz tīkla augšmalai vai nevar droši
        piezemēties savā laukuma pusē, nepieskaroties tīklam vai citam
        spēlētājam.
      defense: >-
        Spēlētājam ir grūti izcelt bumbu gaisā, kad tā tiek sista viņa virzienā.
      serve_receive: >-
        Spēlētājam ir grūti uzņemt servi.
      serving: >-
        Spēlētājam ir grūti izpildīt noteikumiem atbilstošu servi.
      setting: >-
        Spēlētājam ir grūti precīzi piespēlēt bumbu gremdei.

  - level: 1
    criteria:
      attacking: >-
        Spēlētājs var uzbrukt bumbai no augšas vismaz ar vidēju ātrumu pa loka
        trajektoriju uz laukuma pēdējo trešdaļu vai ar mazu/vidēju ātrumu pa
        lejupvērstu trajektoriju.
      blocking: >-
        Spēlētājs var veidot individuālu bloku ar rokām virs tīkla vai mīksto
        bloku pie tīkla augšmalas un droši piezemēties savā laukuma pusē.
      defense: >-
        Spēlētājs vēl mācās sekot uzbrucēja darbībai, bet spēj uzņemt uz viņu
        raidītas vai no bloka atlēkušas bumbas un piespēlēt tās uz augšu un
        laukuma priekšējās daļas virzienā.
      serve_receive: >-
        Spēlētājs var uzņemt lēnu servi, piespēlējot bumbu uz tīklu / laukuma
        priekšējo daļu.
      serving: >-
        Spēlētājs var izpildīt noteikumiem atbilstošu servi (apakšējo vai
        augšējo) un stabili ievadīt bumbu spēlē.
      setting: >-
        Ja pirmā piespēle nonāk laukuma priekšējā daļā, spēlētājs var stabili
        piespēlēt līdzspēlētājam ērtu bumbu gremdei — ar apakšējo vai augšējo
        piespēli.

  - level: 2
    criteria:
      attacking: >-
        Spēlētājs var izpildīt gremdi pēc ieskrējiena vai spēcīgu sitienu no
        vietas. Zina, kur atkāpties no tīkla un kā izvēlēties vietu pirms
        ieskrējiena gremdei, un var nedaudz pielāgoties neprecīzai piespēlei.
        Gremdēm var pietrūkt spēka, bet tās parasti trāpa laukumā un tā, ka
        2.–3. līmeņa spēlētājiem tās ir grūti uzņemt.
      blocking: >-
        Spēlētājs var pacelt rokas virs tīkla un traucēt pretinieka uzbrukumu,
        mīkstinot gremdi vai novirzot bumbu saviem aizsardzības spēlētājiem.
        Dažreiz veido divspēlētāju bloku ar blakus esošo spēlētāju. Prot droši
        atsperties un piezemēties, nepieskaroties tīklam.
      defense: >-
        Spēlētājs labi orientējas laukumā un zina, kur pārvietoties, kad
        pretinieks gremdē. Var uzņemt vidēja spēka gremdes ar apakšējo vai
        augšējo piespēli un piespēlēt bumbu augstu, lai līdzspēlētāji to
        varētu sasniegt. Zina savu vietu komandas aizsardzības sistēmā. Reti
        kļūdās, uzņemot pāri tīklam vienkārši piespēlētu bumbu.
      serve_receive: >-
        Spēlētājs stabili (70% gadījumu) uzņem vidēja ātruma servi tā, lai
        varētu izdarīt otro piespēli, — ar augšējo vai apakšējo piespēli.
        Cēlājam lielākajā daļā gadījumu ir vismaz 1 vienkāršs piespēles
        variants. Kopumā zina savu vietu serves uzņemšanā, bet sarežģītākā
        sistēmā (5-1 vai 6-2) var būt vajadzīgi līdzspēlētāju norādījumi.
      serving: >-
        Spēlētājs stabili (70%) izpilda augšējo servi laukumā. Var servēt uz
        noteiktām laukuma zonām, lai apgrūtinātu pretiniekam serves
        uzņemšanu.
      setting: >-
        Spēlētājs stabili piespēlē ērtu bumbu gremdei malējam uzbrucējam
        un 3. zonā no lielākās daļas laukuma priekšējās daļas un dažreiz
        piespēlē atmuguriski. Pārliecinoši izpilda augšējo piespēli gandrīz
        bez dubultpieskārieniem. Zina, kā iziet pie tīkla, kad ir saspēles
        vadītājs (parasti sistēmā 4-2 vai 5-1).

  - level: 3
    criteria:
      attacking: >-
        Spēlētājs zina, kur atrasties laukumā uzbrukuma organizēšanas laikā,
        un spēj lēcienā izpildīt gremdi lejup. Raida bumbu uz nenosegtām
        laukuma vietām, un precīza piespēle pret 2.–3. līmeņa spēlētājiem
        parasti beidzas ar izcīnītu punktu. No viņa negaida spēli bez kļūdām,
        bet uzbrukuma efektivitātei kopumā jābūt pozitīvai.
      blocking: >-
        Spēlētājs var pacelt rokas virs tīkla un pārnest tās pāri tīklam,
        nosedzot daļu gremdes virzienu. Pareizi izvēlas laiku lēcienam, seko
        pretinieka cēlājam un uzbrucējiem un veido divspēlētāju bloku ar
        līdzspēlētājiem.
      defense: >-
        Spēlētājs vienmēr zina, kur atrasties izspēles gaitā, kuru laukuma
        daļu sedz un par ko atbild komandas aizsardzības sistēmā, un sazinās
        ar līdzspēlētājiem. Kad 2.–3. līmeņa spēlētāji uz viņu gremdē, viņš
        parasti spēj uzņemt gremdi un piespēlēt bumbu uz laukuma priekšējo
        daļu / cēlājam.
      serve_receive: >-
        Spēlētājs stabili (70% gadījumu) precīzi uzņem 2.–3. līmeņa spēlētāju
        servi, atstājot cēlājam vismaz 2 vienkāršus piespēles variantus.
        Vienojas ar līdzspēlētājiem par servēm starp spēlētājiem un zina savu
        vietu serves uzņemšanā sistēmās 5-1 un 6-2.
      serving: >-
        Spēlētājs stabili (70%) servē uz izvēlēto zonu. Pret 2.–3. līmeņa un
        dažreiz arī 4.–5. līmeņa spēlētājiem var servēt tā, ka apgrūtina
        serves uzņemšanu vai dažreiz iegūst punktu ar servi.
      setting: >-
        Spēlētājs no precīzas pirmās piespēles precīzi piespēlē bumbu gremdei
        jebkuram pirmās līnijas uzbrucējam. Var piespēlēt kustībā un pēc
        pārvietošanās lielākajā daļā laukuma zonu, lai dotu līdzspēlētājiem
        ērtu bumbu gremdei, un vienojas ar uzbrucējiem par viņiem vajadzīgajām
        piespēlēm. Var būt saspēles vadītājs sistēmā 5-1 vai 6-2.

  - level: 4
    criteria:
      attacking: >-
        Spēlētājs var izpildīt spēcīgu gremdi. Prot pielāgoties neprecīzai
        piespēlei un tik un tā droši gremdēt ar spēku vai gudri izvēlētā zonā,
        izjaucot pretinieka uzbrukuma organizāciju. Pārvietošanās ļauj
        izpildīt ieskrējienu zemām un īsām piespēlēm uzbrukuma kombinācijās.
        Pieņem gudrus lēmumus un izmanto dažādus gremdes veidus un māņu
        sitienus, lai izcīnītu punktus arī pret divspēlētāju bloku. Uzbrukuma
        efektivitāte parasti ir vismaz 0,100.
      blocking: >-
        Spēlētājs var pacelt rokas virs tīkla un pārnest tās pāri tīklam,
        nosedzot galvenos gremdes virzienus un novirzot gremdes uz zonām, kur
        atrodas aizsardzības spēlētāji. Stabili pieslēdzas līdzspēlētājiem
        divspēlētāju (vai trīsspēlētāju) blokā. Bieži mīkstina gremdi un
        dažreiz to nobloķē.
      defense: >-
        Spēlētājs prot izvēlēties vietu aiz sava bloka un paredzēt gremdes
        virzienu, lai uzņemtu bumbu pret 4.–5. līmeņa uzbrukumu ar vairākiem
        uzbrucējiem. Laba aizsardzības tehnika un reakcija. No bloka
        atlēkušas vai tuvumā iemānītas bumbas parasti precīzi piespēlē
        cēlājam.
      serve_receive: >-
        Spēlētājs stabili (75% gadījumu) precīzi uzņem 4.–5. līmeņa spēlētāju
        servi, atstājot cēlājam vismaz 2 vienkāršus piespēles variantus. Reti
        zaudē punktu, uzņemot servi, un neprecīzi uzņemtas serves parasti vēl
        ir spēlējamas līdzspēlētājiem.
      serving: >-
        Pret 4.–5. līmeņa spēlētājiem var servēt tā, ka apgrūtina serves
        uzņemšanu vai dažreiz iegūst punktu ar servi. Var vairāk riskēt un
        servēt spēcīgāk, taču lielākoties bumbai jāpārlido pāri tīklam un
        jātrāpa laukumā.
      setting: >-
        Spēlētājs var organizēt augsta līmeņa uzbrukumu, pielāgojoties pirmajai
        piespēlei jebkurā laukuma vietā. Prot norunāt un izspēlēt uzbrukuma
        kombinācijas ar uzbrucējiem. Piespēlē kustībā un pat no neprecīzas
        pirmās piespēles parasti spēj dot līdzspēlētājiem ērtu bumbu gremdei.

  - level: 5
    criteria:
      attacking: >-
        Spēlētājs stabili izcīna punktus pret 4.–5. līmeņa spēlētājiem.
        Efektīvi gremdē no pirmās un otrās līnijas un izcīna punktus arī no
        neprecīzām piespēlēm. Viņam ir spēles izpratne un fiziskā
        sagatavotība sarežģītām, iepriekš norunātām uzbrukuma kombinācijām.
        Uzbrukuma efektivitāte parasti ir vismaz 0,250.
      blocking: >-
        Spēlētājs ātri pielāgojas uzbrukumam ar vairākiem spēcīgiem
        uzbrucējiem, sekojot pretinieka cēlājam un uzbrucējiem. Rokas blokā ir
        pilnībā pārnestas pāri tīklam un rada spiedienu uz spēcīgiem
        uzbrucējiem: mīkstina vai nobloķē gremdes, liek uzbrucējam kļūdīties.
      defense: >-
        Spēlētājs atšifrē spēcīgu uzbrucēju darbību un tai pielāgojas. Droši
        sedz savu laukuma daļu un spēj uzņemt pat spēcīgāko uzbrucēju
        gremdes, dodot līdzspēlētājiem iespēju turpināt izspēli.
      serve_receive: >-
        Spēlētājs stabili (85% gadījumu) precīzi uzņem 4.–5. līmeņa spēlētāju
        servi, nodrošinot cēlājam visus 3 piespēles variantus. Reti zaudē
        punktu, uzņemot servi, un arī no neprecīzi uzņemtas serves komanda
        spēj organizēt uzbrukumu.
      serving: >-
        Pret 4.–5. līmeņa spēlētājiem regulāri (80%) servē tā, ka apgrūtina
        serves uzņemšanu. Pret zemāka līmeņa spēlētājiem bieži iegūst punktus
        ar servi.
      setting: >-
        Spēlētājam ir augsta piespēles tehnika no jebkuras laukuma vietas, un
        viņš pieņem gudrus lēmumus. Arī no viduvējas pirmās piespēles ļauj
        komandai izspēlēt uzbrukuma kombinācijas, kas dod uzbrucējiem
        priekšrocību pār bloku. Gandrīz ar katru pieskārienu uzlabo
        līdzspēlētāja neprecīzo piespēli.

  - level: 6
    criteria:
      attacking: >-
        Spēlētājs ir viens no galvenajiem uzbrucējiem augsta līmeņa
        uzbrukumā. Ļoti labi fiziski sagatavots, pielāgojas pretinieka blokam
        un aizsardzībai un izcīna punktus ar ļoti augstu stabilitāti.
      blocking: >-
        Spēlētājs atšifrē 6. līmeņa uzbrukumu un tam pielāgojas, aktīvi
        piedaloties komandas bloķēšanas taktikā (nobloķē gremdes gan
        vienspēlētāja, gan grupu blokā), vai dominē pār 4.–5. līmeņa
        pretinieka uzbrukumu, vairākas reizes spēlē nobloķējot gremdes.
      defense: >-
        Laba reakcija, spēles izpratne un fiziskā sagatavotība ļauj
        spēlētājam atrasties pareizajā vietā un uzņemt gremdes pat pret
        visspēcīgāko uzbrukumu. Uzņemtā bumba lido augstu un uz laukuma
        priekšējo daļu, kur cēlājam ir vairāki piespēles varianti.
      serve_receive: >-
        Spēlētājs stabili (90% gadījumu) precīzi uzņem 6. līmeņa spēlētāju
        servi. Reti zaudē punktu, uzņemot servi, un gandrīz vienmēr dod
        komandai spēlējamu bumbu.
      serving: >-
        Pret 6. līmeņa spēlētājiem var servēt tā, ka izjauc pretinieka
        uzbrukuma organizāciju. Pret zemāka līmeņa spēlētājiem regulāri
        iegūst punktus ar servi.
      setting: >-
        Spēlētājs var organizēt sarežģītu uzbrukumu un ar augstu stabilitāti
        piespēlēt bumbu vajadzīgajā augstumā, attālumā un ātrumā. Pieņem
        gudrus lēmumus un palīdz veidot uzbrukuma kombinācijas, kas ļauj
        uzbrucējiem gremdēt bez bloka vai pret vienspēlētāja bloku pat pret
        6. līmeņa bloķētājiem.
